spring.application.name=demo
server.port=8080

# Database Configuration
# Default to robust H2 in-memory or file database with MySQL compatibility mode for seamless local execution out of the box
# Can be configured to connect directly to MySQL by specifying spring.profiles.active=mysql or overriding datasource properties
spring.datasource.url=jdbc:h2:mem:research_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JSON serialization
spring.jackson.serialization.indent_output=true
spring.jackson.default-property-inclusion=non_null
