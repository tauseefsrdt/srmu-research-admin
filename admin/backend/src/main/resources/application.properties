spring.application.name=demo
server.port=8080

# Database Configuration (MySQL local-dev)
spring.datasource.url=jdbc:mysql://192.200.12.37:3306/srmu_research?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=admin
spring.datasource.password=Srdt@217
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JSON serialization
spring.jackson.serialization.indent_output=true
spring.jackson.default-property-inclusion=non_null

# Multipart & File Upload Configuration (Allow up to 50MB images)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=50MB
server.tomcat.max-http-form-post-size=50MB
